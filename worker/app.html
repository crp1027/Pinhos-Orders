<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#FBF7F0">
<title>Pinho’s Cake Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Great+Vibes&display=swap">
<style>
/* Layout: binder-tab header over dense working lists; detail opens as a side sheet (full screen on phones). */
:root{
  --bg:#FBF7F0; --surface:#FFFFFF; --surface2:#F4EEE4; --ink:#2B2A33; --ink2:#6E6A73; --line:#ECE4D8; --line2:#DDD3C4;
  --accent:#3D6FB6; --accent-ink:#FFFFFF; --accent-soft:#E6EEF9;
  --good:#3B7A55; --good-soft:#E3F2E8; --warn:#9A6516; --warn-soft:#FCF0DC; --bad:#B4483C; --bad-soft:#FBEAE6; --ice:#0A5E78; --ice-soft:#D9F1F8;
  --s0:#3F4856; --s0b:#E6EAF0; --s1:#7A4300; --s1b:#FBE5C8; --s2:#1A458C; --s2b:#D9E6FB; --s3:#5B3391; --s3b:#ECE0FA; --s4:#17603A; --s4b:#D3EEDB;
  --demo:#7A5AA6; --demo-soft:#F5EFFA; --shadow:0 8px 30px rgba(80,60,30,.14);
  --paper:#FFFFFF; --paper-ink:#111111; --wheat:#F2C766; --foh:#0F5C5A; --foh-soft:#DDF1EF;
  --f-body:"Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-brand:"Great Vibes", "Brush Script MT", cursive;
  --r:14px; --tap:48px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#171E28; --surface2:#1F2835; --ink:#E9EEF5; --ink2:#A9B5C4; --line:#2C3746; --line2:#3B4859;
  --accent:#7FA8F0; --accent-ink:#0B1626; --accent-soft:#1E2E4A;
  --good:#7FD3A0; --good-soft:#163323; --warn:#F2BE6B; --warn-soft:#3A2A10; --bad:#F59A8F; --bad-soft:#3D1B17; --ice:#7DD3EC; --ice-soft:#123543;
  --s0:#C9D1DC; --s0b:#2A3341; --s1:#F5C27C; --s1b:#3E2B12; --s2:#9CC0FA; --s2b:#1C2F52; --s3:#CDB0F5; --s3b:#33224D; --s4:#86D9A6; --s4b:#173A26;
  --demo:#CDB0F5; --demo-soft:#2E2142; --shadow:0 8px 30px rgba(0,0,0,.5); --foh:#7FD6CF; --foh-soft:#173836; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E28; --surface2:#1F2835; --ink:#E9EEF5; --ink2:#A9B5C4; --line:#2C3746; --line2:#3B4859;
  --accent:#7FA8F0; --accent-ink:#0B1626; --accent-soft:#1E2E4A;
  --good:#7FD3A0; --good-soft:#163323; --warn:#F2BE6B; --warn-soft:#3A2A10; --bad:#F59A8F; --bad-soft:#3D1B17; --ice:#7DD3EC; --ice-soft:#123543;
  --s0:#C9D1DC; --s0b:#2A3341; --s1:#F5C27C; --s1b:#3E2B12; --s2:#9CC0FA; --s2b:#1C2F52; --s3:#CDB0F5; --s3b:#33224D; --s4:#86D9A6; --s4b:#173A26;
  --demo:#CDB0F5; --demo-soft:#2E2142; --shadow:0 8px 30px rgba(0,0,0,.5); --foh:#7FD6CF; --foh-soft:#173836; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16.5px/1.4 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.55rem} h2{font-size:1.2rem} h3{font-size:1.05rem}
p{margin:.4em 0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink2)} .small{font-size:.88rem} .xs{font-size:.74rem;letter-spacing:.05em}
.badtxt{color:var(--bad);font-weight:700} .goodtxt{color:var(--good);font-weight:700} .warntxt{color:var(--warn);font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{flex:none}
#root{min-height:100vh}
.app{padding-bottom:84px}
.app.has-sel{padding-bottom:190px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:var(--tap);padding:.5em 1em;border:1.5px solid var(--line2);border-radius:var(--r);background:var(--surface);cursor:pointer;font-weight:700;text-align:center;line-height:1.15}
.btn:hover{border-color:var(--accent)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:42px;padding:.35em .8em;font-size:.92rem}
.btn.big{min-height:56px;font-size:1.05rem;justify-content:flex-start;padding:.6em 1.1em}
.btn.wide{width:100%;margin-top:10px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)} .btn.ghost:hover{border-color:var(--line2)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)} .btn.danger.ghost{background:transparent;color:var(--bad);border-color:transparent}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.ice.on{background:var(--ice-soft);border-color:var(--ice);color:var(--ink)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);border-radius:var(--r);border:1.5px solid transparent;background:transparent;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--line2)} .iconbtn.sm{width:40px;height:40px} .iconbtn.on{background:var(--accent-soft)} .iconbtn:disabled{opacity:.35}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.link.h{font-size:1.1rem;text-decoration:none}
.stb.st1{border-color:var(--s1)} .stb.st2{border-color:var(--s2)} .stb.st3{border-color:var(--s3)} .stb.st4{border-color:var(--s4)}
.btn.primary.st4,.btn.primary.stb.st4{background:var(--s4);border-color:var(--s4);color:var(--surface)}
.btn.primary.stb.st1{background:var(--s1);color:var(--surface)} .btn.primary.stb.st2{background:var(--s2);color:var(--surface)} .btn.primary.stb.st3{background:var(--s3);color:var(--surface)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px;text-align:left}
.brand b{display:block;font-family:var(--f-brand);font-weight:400;font-size:2rem;line-height:.95;color:var(--accent)}
.logo{flex:none;display:block} .boot .brand.big{color:var(--accent)}
.brand small{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.brand .mark{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-brand);font-size:1.3rem}
.brand.big{font-family:var(--f-brand);font-size:2.2rem;display:block;margin-bottom:12px}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 16px;border:0;border-radius:var(--r);background:none;cursor:pointer;font-weight:700;color:var(--ink2)}
.tab:hover{background:var(--surface2)} .tab.on{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.sync{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:.85rem;color:var(--ink2)}
.synctxt.stale{color:var(--warn);font-weight:700}
.bottomnav{display:none}
.banner{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.banner.demo{background:var(--demo-soft);color:var(--ink)} .banner.demo b{color:var(--demo)}
.banner.bad{background:var(--bad-soft)}
.boot{max-width:560px;margin:12vh auto;padding:0 16px}
main{padding:16px;max-width:1500px;margin:0 auto}
.screen{display:flex;flex-direction:column;gap:14px}

/* Today */
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.daynav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dateinp{width:auto;min-height:42px;border:1.5px solid var(--line2);border-radius:var(--r);padding:0 10px;background:var(--surface)}
.rel{font-size:1rem;color:var(--ink2);font-weight:400;margin-left:6px}
.findbar{display:flex;flex-direction:column;gap:10px}
.searchbox{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line2);border-radius:var(--r);padding:0 12px;background:var(--surface);max-width:560px}
.searchbox input{border:0;outline:0;padding:0;min-height:var(--tap);flex:1;min-width:0;background:transparent}
.searchbox.big{max-width:none} .searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:700;font-size:.95rem}
.chip.sm{min-height:38px;padding:0 12px;font-size:.88rem}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.countbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.cb-stages{display:flex;flex-wrap:wrap;gap:6px 12px}
.cnt{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums}
.cb-act{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}

/* pills / tags / flags */
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.88rem;white-space:nowrap;border:1px solid transparent}
.pill.sm{padding:1px 8px;font-size:.78rem}
.st0{background:var(--s0b);color:var(--s0)} .st1{background:var(--s1b);color:var(--s1)} .st2{background:var(--s2b);color:var(--s2)} .st3{background:var(--s3b);color:var(--s3)} .st4{background:var(--s4b);color:var(--s4)}
.pill.coll{background:var(--surface2);color:var(--ink2);border-color:var(--line2)} .pill.part{background:var(--warn-soft);color:var(--warn)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.tag.demo{background:var(--demo-soft);color:var(--demo);border-color:transparent} .tag.draft{background:var(--warn-soft);color:var(--warn)} .tag.canceled{background:var(--bad-soft);color:var(--bad)} .tag.coll{background:var(--good-soft);color:var(--good)} .tag.ex{background:var(--warn-soft);color:var(--warn)}
.flag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:.8rem;font-weight:700;white-space:nowrap}
.flag.bad{background:var(--bad-soft);color:var(--bad)} .flag.good{background:var(--good-soft);color:var(--good)} .flag.warn{background:var(--warn-soft);color:var(--warn)} .flag.warn2{background:var(--surface2);color:var(--warn)}
.flag.ice{background:var(--ice-soft);color:var(--ice)} .flag.info{background:var(--accent-soft);color:var(--ink)} .flag.coll{background:var(--surface2);color:var(--ink2)}
.paytag{font-weight:700} .paytag.paid{color:var(--good)} .paytag.unpaid,.paytag.part{color:var(--bad)} .paytag.credit{color:var(--ice)}

/* sections & rows */
.sec{display:flex;flex-direction:column;gap:8px}
.sechead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 12px;margin-top:6px}
.secn{font-size:.9rem;font-weight:400;color:var(--ink2);margin-left:6px}
.selctl{display:flex;gap:4px;flex-wrap:wrap}
.empty{padding:22px;text-align:center;border:1.5px dashed var(--line2);border-radius:var(--r);color:var(--ink2);background:var(--surface)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:52px 96px minmax(170px,1.25fr) minmax(200px,2fr) 128px minmax(150px,1.5fr) 118px;grid-template-areas:"ck time who spec stg flags bal";align-items:center;gap:4px 10px;padding:6px 10px 6px 0;min-height:58px;border-top:1px solid var(--line);cursor:pointer;font-size:1rem}
.rows>.row:first-child,.rows>.rowhead+*{border-top:0}
.row:hover{background:var(--surface2)}
.row.sel{background:var(--accent-soft)}
.row.done{opacity:.72}
.rowhead{display:grid;grid-template-columns:52px 96px minmax(170px,1.25fr) minmax(200px,2fr) 128px minmax(150px,1.5fr) 118px;gap:10px;padding:6px 10px 6px 0;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);background:var(--surface2);border-bottom:1px solid var(--line)}
.ck{grid-area:ck;display:flex;align-items:center;justify-content:center;align-self:stretch;cursor:pointer}
.ck input{width:26px;height:26px;accent-color:var(--accent);cursor:pointer}
.ptime{grid-area:time;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ptime small{display:block;font-weight:400;font-size:.78rem;color:var(--ink2)}
.who{grid-area:who;min-width:0} .who b{font-variant-numeric:tabular-nums}
.spec{grid-area:spec;min-width:0;color:var(--ink)} .insc-s{color:var(--ink2);font-style:italic}
.stg{grid-area:stg} .flags{grid-area:flags;display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.bal{grid-area:bal;justify-self:end;min-height:42px;padding:0 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap}
.bal.paid{color:var(--good)} .bal.unpaid,.bal.part{color:var(--bad)} .bal.nototal{color:var(--ink2);font-weight:400}
.bal-none{grid-area:bal}
.ogroup{border-top:1px solid var(--line)} .rows>.ogroup:first-child{border-top:0}
.orow{background:var(--surface2);min-height:50px}
.irow.child{border-top:1px dashed var(--line)} .irow.child .who{padding-left:14px}
.hourhdr{padding:6px 12px;background:var(--bg);font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);border-top:1px solid var(--line);display:flex;gap:10px}
.hourhdr span{font-weight:400;text-transform:none;letter-spacing:0}
.rows.compact .row{min-height:50px;font-size:.95rem}

@media (max-width:1023px){
  .rowhead{display:none}
  .row{grid-template-columns:52px 84px minmax(0,1fr) auto auto;grid-template-areas:"ck time who stg bal" "ck time spec spec spec" "ck time flags flags flags";padding:8px 10px 8px 0}
  .flags:empty{display:none}
}
@media (max-width:640px){
  body{font-size:16px}
  .tabs,.sync .synctxt{display:none}
  .top{padding:6px 12px}
  main{padding:12px 16px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;border:0;background:none;font-size:.78rem;font-weight:700;color:var(--ink2);cursor:pointer}
  .bottomnav button.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
  .row{grid-template-columns:46px auto minmax(0,1fr) auto;grid-template-areas:"ck time stg bal" "ck who who who" "ck spec spec spec" "ck flags flags flags";gap:3px 8px}
  .stg{justify-self:start}
  .cb-act{margin-left:0}
  .findbar .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .findbar .chip{flex:none}
  h1{font-size:1.3rem}
}

/* selection bar */
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:2px solid var(--accent);box-shadow:var(--shadow);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.selsum{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.selacts{display:flex;flex-wrap:wrap;gap:6px}
.narrowonly{display:none}
@media (max-width:900px){ .wideonly{display:none} .narrowonly{display:inline-flex} }
@media (max-width:640px){ .selbar{bottom:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:10px} .app.has-sel{padding-bottom:260px} }

/* sheet (order detail) */
.sheet-scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.45);display:flex;justify-content:flex-end}
.sheet{width:min(760px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.shead{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sh-title{flex:1;min-width:0} .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sbody>*{flex-shrink:0}
.sbody{flex:1;overflow:auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.pad{padding:16px}
.osum{display:flex;flex-direction:column;gap:6px}
.pickupbig{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px} .pickupbig b{font-size:1.25rem}
.kvline{display:flex;flex-wrap:wrap;gap:4px 18px}
.actbar{display:flex;flex-wrap:wrap;gap:8px}
.callout{padding:10px 12px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line);display:block}
.callout.warn{background:var(--warn-soft);border-color:transparent} .callout.bad{background:var(--bad-soft);border-color:transparent} .callout.good{background:var(--good-soft);border-color:transparent} .callout.info{background:var(--accent-soft);border-color:transparent}
.callout.sm{padding:4px 10px;font-size:.88rem}
.callout ul{margin:.3em 0 .3em 1.2em;padding:0}
.callout .btn{margin:4px 4px 0 0}
.itabs{display:flex;gap:6px;overflow-x:auto}
.itab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:130px;padding:8px 12px;border-radius:var(--r);border:1.5px solid var(--line2);background:var(--surface);cursor:pointer;text-align:left}
.itab.on{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.ipanel{display:flex;flex-direction:column;gap:12px}
.ih{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stbtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:68px;padding:8px 10px;border-radius:var(--r);border:2px solid var(--line2);background:var(--surface);cursor:pointer;text-align:left}
.stbtn .stn{font-weight:700;line-height:1.15} .stbtn .stt{font-size:.74rem;color:var(--ink2)}
.stbtn.past{background:var(--surface2)}
.stbtn.on.st0{background:var(--s0b);border-color:var(--s0)} .stbtn.on.st1{background:var(--s1b);border-color:var(--s1)} .stbtn.on.st2{background:var(--s2b);border-color:var(--s2)} .stbtn.on.st3{background:var(--s3b);border-color:var(--s3)} .stbtn.on.st4{background:var(--s4b);border-color:var(--s4)}
.stbtn.on .stn::before{content:"● "}
.stbtn:disabled{cursor:not-allowed;opacity:.7}
@media (max-width:640px){ .stages{grid-template-columns:1fr 1fr} .stbtn:last-child{grid-column:1/-1} }
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media (max-width:640px){.twocol{grid-template-columns:1fr}}
.box2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px 14px}
.kv{display:flex;flex-direction:column} .kv .k{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)} .kv .v{font-weight:700} .kv.full{grid-column:1/-1}
.pre{white-space:pre-wrap;font-weight:400!important}
.inscbox{border:2px solid var(--ink);border-radius:8px;padding:10px 12px}
.insctext{font-size:1.25rem;font-weight:700;white-space:pre-wrap}
.tiers,.pays{width:100%;border-collapse:collapse;font-size:.95rem}
.tiers th,.tiers td,.pays th,.pays td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tiers th,.pays th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}

<script>
/* ===== cloud.js — connects the app to the Cloudflare Worker (replaces Claude's db/assets/downloads) =====
   Same interface the app already uses: db.doc(path).get/set/update/delete/acquire/onSnapshot,
   db.collection(name).where(...).get/onSnapshot, assets.upload, downloads.save.
   Changes from other devices arrive by polling /api/sync every few seconds while the screen is visible. */
(function () {
  window.__cloud = true;
  const POLL_MS = 4000;
  const cache = new Map();              // path -> data (synced paths: orders/*, settings/*)
  let ver = 0, ready = false, readyWaiters = [], failures = 0;
  const listeners = new Set();
  const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const notify = () => { for (const l of [...listeners]) { try { l(); } catch (e) { console.error(e); } } };

  async function api(url, opts = {}) {
    let r;
    try { r = await fetch(url, { credentials: 'same-origin', ...opts, headers: { ...(opts.body && !(opts.body instanceof Blob) ? { 'content-type': 'application/json' } : {}), ...(opts.headers || {}) } }); }
    catch (e) { throw { code: 'unavailable', message: 'The bakery records could not be reached. Check the internet connection and try again.' }; }
    if (r.status === 401) { location.href = '/'; throw { code: 'revoked', message: 'This device was locked. Enter the PIN again.' }; }
    let body = null; try { body = await r.json(); } catch { }
    if (!r.ok) throw (body && body.code) ? body : { code: r.status >= 500 ? 'unavailable' : 'invalid_argument', message: (body && body.message) || `Server error ${r.status}` };
    return body;
  }
  const post = (url, data) => api(url, { method: 'POST', body: JSON.stringify(data) });

  function apply(docs) {
    for (const d of docs) { if (d.data == null) cache.delete(d.path); else cache.set(d.path, d.data); }
  }
  async function pull() {
    try {
      const r = await api('/api/sync?since=' + ver);
      if (r.reset) cache.clear();
      apply(r.docs); const changed = r.docs.length > 0 || !ready; ver = r.ver; failures = 0;
      if (!ready) { ready = true; readyWaiters.forEach(f => f()); readyWaiters = []; }
      if (changed) notify();
    } catch (e) { failures++; if (failures === 3) console.warn('sync failing', e); }
  }
  const whenReady = () => ready ? Promise.resolve() : new Promise(r => readyWaiters.push(r));
  let timer = null;
  function loop() { clearTimeout(timer); timer = setTimeout(async () => { if (!document.hidden) await pull(); loop(); }, POLL_MS); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { pull(); loop(); } });
  pull().then(loop);

  const snap = (path, data) => ({ id: path.split('/').pop(), exists: data != null, data: () => clone(data), metadata: { fromCache: false, hasPendingWrites: false } });
  const parentOf = p => p.split('/').slice(0, -1).join('/');

  function docRef(path) {
    return {
      id: path.split('/').pop(), path,
      async get() { const r = await api('/api/doc?path=' + encodeURIComponent(path)); if (r.data == null) cache.delete(path); else if (cache.has(path) || /^(orders|settings)\//.test(path)) cache.set(path, r.data); return snap(path, r.data); },
      async set(data) { const r = await post('/api/write', { op: 'set', path, data }); cache.set(path, r.data); notify(); },
      async update(data) { const r = await post('/api/write', { op: 'update', path, data }); cache.set(path, r.data); notify(); },
      async delete() { await post('/api/write', { op: 'delete', path }); cache.delete(path); notify(); },
      async acquire({ holder, ttlMs }) { return post('/api/lease', { path, holder, ttlMs }); },
      onSnapshot(next, onErr) {
        const f = () => next(snap(path, cache.get(path)));
        whenReady().then(() => { listeners.add(f); f(); });
        return () => listeners.delete(f);
      }
    };
  }
  function query(coll, where) {
    where = where || [];
    const local = () => {
      const docs = [...cache.entries()].filter(([p]) => parentOf(p) === coll)
        .filter(([, b]) => where.every(([f, op, v]) => { const x = b[f]; return op === '>=' ? x >= v : op === '<=' ? x <= v : op === '==' ? x === v : true; }))
        .sort((a, b) => a[0] < b[0] ? -1 : 1).map(([p, b]) => snap(p, b));
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
    };
    const q = {
      where: (f, op, v) => query(coll, [...where, [f, op, v]]), orderBy: () => q, limit: () => q,
      async get() {
        const r = await api('/api/query?coll=' + encodeURIComponent(coll) + '&where=' + encodeURIComponent(JSON.stringify(where)));
        const docs = r.docs.map(d => snap(d.path, d.data));
        if (/^(orders|settings)$/.test(coll)) { for (const d of r.docs) cache.set(d.path, d.data); }
        return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
      },
      onSnapshot(next) { const f = () => next(local()); whenReady().then(() => { listeners.add(f); f(); }); return () => listeners.delete(f); }
    };
    return q;
  }
  const db = { doc: docRef, collection: c => Object.assign(query(c), { path: c, doc: id => docRef(c + '/' + (id || Math.random().toString(36).slice(2))) }) };

  const assets = {
    async upload(blob) {
      if (blob.size > 20 * 1024 * 1024) throw { code: 'too_large' };
      return api('/api/asset', { method: 'POST', body: blob, headers: { 'content-type': blob.type || 'application/octet-stream' } });
    }
  };
  window.__assetUrl = id => '/a/' + encodeURIComponent(id);

  const downloads = {
    async save({ filename, data }) {
      const url = URL.createObjectURL(data); const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return { status: 'saved' };
    }
  };
  const user = { async canEdit() { return true; } };

  /* Receipt printer (Star CloudPRNT via the Worker). Only switched on once the Worker says a printer key is set. */
  const printer = {
    send: jobs => post('/api/print', { jobs }),
    status: () => api('/api/printer'),
    jobs: async ids => (await api('/api/print/jobs?ids=' + ids.map(encodeURIComponent).join(','))).jobs
  };
  const checkPrinter = () => api('/api/printer').then(st => {

    if (kinds.includes('custom')) quote(`“${fl.find((f, i) => kinds[i] === 'custom')}” is not on the menu, so it has no set price. Enter its price in step 3 (Override the price).`);

    if (tk2.includes('tiramisu')) warn('Tiramisu isn’t confirmed for every tier-style size. Check with a manager.');
    if (tf.some(f => (fk(f) || {}).noStd)) warn('The 8/12-inch carrot restriction isn’t confirmed for tier-style cakes. Check with a manager.');
    if (tk2.includes('custom')) quote('A tier uses a flavor that isn’t on the menu. Confirm the price.');
    if (row.delivery) {

    if (!cfl.length || (gs.length && gs.some(g => !g.flavor))) { block('Choose a cupcake flavor' + (gs.length ? ' for every group.' : '.')); return done(); }

    if (q % 12 !== 0) quote(`${q} cupcakes isn’t a whole number of dozens. Partial dozens have no confirmed price. Enter its price in step 3 (Override the price).`);
    else { const rate = prem ? m.cupcake.premcake : m.cupcake.classic; add(`${q / 12} dozen ${prem ? 'red velvet / carrot' : 'classic'} × ${fmtMoney(rate)}${prem && gs.length > 1 ? ' (whole order at the higher price)' : ''}`, rate * q / 12); }

  } else {

  if (A.animated) add('Animated picture', ad.animated);
  if (A.portrait) add('Personal portrait', ad.portrait);

/* ===== store.js — shared database (db capability), assets, leases ===== */

const Store = {

function errText(e) {

    store_unavailable: 'Image storage could not be reached. Try again.',
    resource_exhausted: 'Too many changes at once. Wait a few seconds and try again.',
    quota_exceeded: 'The records store is full. Older orders need to be archived or practice orders deleted.',
    quota_or_state: 'Image storage is full or unavailable.',
    revoked: 'Access to the bakery records was removed on this device. Reload the page or sign in again.',
    not_granted: 'This device was not given access to the bakery records.',
    invalid_argument: 'The change could not be saved because it was not accepted by the records store.',
    too_large: 'That file is too large.',
    unsupported_type: 'That file type is not supported. Use a JPEG or PNG photo.',
    busy: 'Another device is saving this order right now. Try again in a moment.',
    rate_limited: 'Too many tries in a row. Wait a moment and try again.',

async function retry(fn) {

function isObj(v) { return v && typeof v === 'object' && !Array.isArray(v); }

  for (const k of Object.keys(b)) out[k] = isObj(a[k]) && isObj(b[k]) ? deepMerge(a[k], b[k]) : b[k];
  return out;

async function initStore() {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') { Store.status = 'nodb'; emit(); return; }
  const [db, assets, downloads, user] = await Promise.all(['db', 'assets', 'downloads', 'user'].map(n => C.use(n).catch(() => null)));
  Store.db = db; Store.assets = assets; Store.downloads = downloads;
  try { Store.canEdit = user ? await user.canEdit() : true; } catch { Store.canEdit = true; }
  if (!db) { Store.status = 'nodb'; emit(); return; }
  subscribe();
  setInterval(() => { if (Store.status === 'live' && Store.lastSync && Date.now() - Store.lastSync > 75000) refreshNow(true); }, 30000);
}
function ingestOrders(docs) {
  const m = new Map();
  for (const d of docs) { const v = d.data(); if (v && v.createdAt) m.set(d.id, { ...v, id: d.id }); }
  Store.orders = m; Store.lastSync = Date.now(); Store.status = 'live'; Store.ready = true;
  let real = false; for (const o of m.values()) if (!o.demo) { real = true; break; }
  Store.autoMode = real ? 'live' : 'demo';
}
function subscribe() {
  for (const u of Store.subs) try { u(); } catch { }
  Store.subs = []; Store.status = 'connecting'; Store.error = null; emit();
  const db = Store.db;
  const onErr = e => { Store.status = 'error'; Store.error = e; emit(); };
  Store.subs.push(db.collection('orders').onSnapshot(snap => { ingestOrders(snap.docs); emit(); maybeArchive(); }, onErr));
  Store.subs.push(db.doc('settings/presets').onSnapshot(s => {
    const d = s.exists ? s.data() : null;
    if (d && d.types) { Store.presets = { ...DEFAULT_PRESETS, ...d }; Store.presetsRev = d.rev || 0; }
    emit();
  }, onErr));
  Store.subs.push(db.doc('settings/menu').onSnapshot(s => {
    const d = s.exists ? s.data() : null;
    if (d && d.standard) { Store.menu = { ...DEFAULT_MENU, ...d }; Store.menuRev = d.rev || 0; }
    emit();
  }, onErr));
  Store.subs.push(db.doc('settings/demo').onSnapshot(s => { const d = s.exists ? s.data() : null; Store.demoAnchor = d && d.anchor || null; emit(); }, onErr));
  Store.subs.push(db.doc('settings/calendar').onSnapshot(s => {
    const d = s.exists ? s.data() : null;
    if (d && d.closedWeekdays) { Store.calendar = { closedWeekdays: d.closedWeekdays, exceptions: d.exceptions || {} }; Store.calRev = d.rev || 0; }
    emit();
  }, onErr));
}
async function refreshNow(silent) {
  if (!Store.db) return;
  try { const snap = await Store.db.collection('orders').get(); ingestOrders(snap.docs); emit(); }
  catch (e) { if (!silent) throw e; }
}
function visibleOrders() {
  const demo = Store.mode === 'demo';
  const out = []; for (const o of Store.orders.values()) if (!!o.demo === demo) out.push(o);
  return out;
}
function getOrder(id) { return Store.orders.get(id) || null; }

async function withLease(ref, fn) {
  for (let i = 0; i < 16; i++) {
    let r;
    try { r = await ref.acquire({ holder: DEV_ID, ttlMs: 4000 }); }
    catch (e) { if (e && (e.code === 'capability_removed')) return fn(); throw e; }
    if (r && r.acquired) return fn();
    await sleep(250 + Math.random() * 300);
  }
  throw { code: 'busy' };
}
async function patchOrder(id, patch, hist) {
  const p = { ...patch, updatedAt: Date.now() };
  if (hist) p.history = deepMerge(p.history || {}, { [uid()]: { at: Date.now(), text: hist, dev: deviceName() } });
  await retry(() => Store.db.doc('orders/' + id).update(p));
}
async function claimNumber(demo) {
  const ref = Store.db.doc('settings/counter');
  return withLease(ref, async () => {
    const s = await ref.get(); const d = (s.exists && s.data()) || {};
    const key = demo ? 'demoNext' : 'next';
    let n = d[key] || (demo ? 9001 : 1001);
    const used = new Set(); for (const o of Store.orders.values()) used.add(o.num);
    while (used.has(n)) n++;
    await retry(() => ref.set({ next: d.next || 1001, demoNext: d.demoNext || 9001, ...{ [key]: n + 1 } }));
    return n;
  });
}

/* ----- archive: keeps the live collection small (5,000-document store cap) ----- */
async function maybeArchive() {
  if (Store._archTried || Store.status !== 'live') return; Store._archTried = true;
  try {
    const cutoff = addDays(todayNY(), -21);
    const elig = [...Store.orders.values()].filter(o => o.pickupDate && o.pickupDate < cutoff && (o.booking === 'canceled' || orderClosed(o)));
    if (!elig.length) return;
    const lock = Store.db.doc('settings/archiver');
    const r = await lock.acquire({ holder: DEV_ID, ttlMs: 60000 }); if (!r.acquired) return;
    const byDate = {}; for (const o of elig.slice(0, 120)) (byDate[o.pickupDate] = byDate[o.pickupDate] || []).push(o);
    for (const [date, list] of Object.entries(byDate)) {
      let k = 1;
      while (list.length) {
        const docId = k === 1 ? date : `${date}.${k}`;
        const ref = Store.db.doc('archive/' + docId);
        const s = await ref.get(); const cur = s.exists && s.data() && s.data().orders ? { ...s.data().orders } : {};
        let size = JSON.stringify(cur).length; const moved = [];
        while (list.length && size + JSON.stringify(list[0]).length < 200000) { const o = list.shift(); const { id, ...body } = o; cur[id] = body; moved.push(id); size += JSON.stringify(body).length; }
        if (moved.length) {
          await retry(() => ref.set({ date, orders: cur }));
          for (const id of moved) await retry(() => Store.db.doc('orders/' + id).delete());
        }
        k++; if (k > 20) break;
      }
    }
  } catch (e) { console.warn('archive skipped', e); }
}
async function loadArchive(from, to) {
  const snap = await retry(() => Store.db.collection('archive').where('date', '>=', from).where('date', '<=', to).get());
  const out = [];
  for (const d of snap.docs) { const v = d.data(); for (const [id, o] of Object.entries((v && v.orders) || {})) out.push({ ...o, id, archived: true }); }
  return out;
}

/* ----- presets & calendar ----- */
async function savePresets(next) {
  const ref = Store.db.doc('settings/presets');
  return withLease(ref, async () => {
    const s = await ref.get(); const cur = s.exists ? s.data() : null;
    if (cur && (cur.rev || 0) !== Store.presetsRev) throw { code: 'conflict', message: 'Preset options were changed on another device. Your view has been refreshed; make your change again.' };
    await retry(() => ref.set({ ...next, rev: (cur && cur.rev || 0) + 1, updatedAt: Date.now() }));
  });
}
async function saveMenu(next) {
  const ref = Store.db.doc('settings/menu');
  return withLease(ref, async () => {
    const s = await ref.get(); const cur = s.exists ? s.data() : null;
    if (cur && cur.standard && (cur.rev || 0) !== Store.menuRev) throw { code: 'conflict', message: 'The menu was changed on another device. Your view has been refreshed; make your change again.' };
    await retry(() => ref.set({ ...next, rev: (cur && cur.rev || 0) + 1, updatedAt: Date.now(), updatedDev: deviceName() }));
  });
}
/** Fresh copies of orders straight from the store (used to catch changes made on another device). */
async function freshOrders(ids) {
  const out = new Map();
  await Promise.all([...new Set(ids)].map(async id => { const s = await retry(() => Store.db.doc('orders/' + id).get()); if (s.exists) out.set(id, { ...s.data(), id }); }));
  return out;
}
async function saveCalendar(next) {

    const s = await ref.get(); const cur = s.exists ? s.data() : null;
    await retry(() => ref.set({ closedWeekdays: next.closedWeekdays, exceptions: next.exceptions || {}, rev: (cur && cur.rev || 0) + 1, updatedAt: Date.now() }));

async function deleteDemoOrders() {
  let n = 0;
  for (const o of [...Store.orders.values()]) if (o.demo) { await retry(() => Store.db.doc('orders/' + o.id).delete()); n++; }
  try {
    const snap = await Store.db.collection('archive').get();
    for (const d of snap.docs) {
      const v = d.data(); const ords = { ...(v.orders || {}) }; let ch = false;
      for (const [id, o] of Object.entries(ords)) if (o.demo) { delete ords[id]; ch = true; n++; }
      if (ch) await retry(() => Store.db.doc('archive/' + d.id).set({ date: v.date, orders: ords }));
    }
  } catch (e) { console.warn(e); }
  return n;
}

/* ----- images ----- */
async function toCanvasBlob(file, maxDim, quality = 0.86) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
  return { blob, w: bmp.width, h: bmp.height };
}
async function uploadImage(file) {
  if (!Store.assets) throw { code: 'not_granted', message: 'Image upload is not available on this device.' };
  const okType = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'].includes(file.type);
  let original = file, note = '';
  if (!okType || file.size > 19.5 * 1024 * 1024) {
    const r = await toCanvasBlob(file, 4096, 0.92); original = r.blob;
    note = !okType ? 'Converted to JPEG for storage.' : 'Reduced to fit the 20 MB storage limit.';
  }
  const thumb = await toCanvasBlob(file, 480, 0.82);
  const up = await retry(() => Store.assets.upload(original));
  const upT = await retry(() => Store.assets.upload(thumb.blob));
  return { asset: up.id, thumb: upT.id, name: file.name || 'photo', note, w: thumb.w, h: thumb.h };
}

/* ===== ops.js — every change to an order goes through here ===== */
function itemPatch(itemId, fields) { return { items: { [itemId]: fields } }; }
function stageFields(it, to, now) {
  const f = { stage: to, stageAt: now, stageLog: { [uid()]: { from: it.stage || 0, to, at: now, dev: deviceName() } } };
  const times = { [to]: now };
  for (let s = (it.stage || 0) + 1; s < to; s++) if (!(it.stageTimes && it.stageTimes[s])) times[s] = now; // skipped stages count as done
  for (let s = to + 1; s <= 4; s++) if (it.stageTimes && it.stageTimes[s]) times[s] = null; // moved back: later stages no longer done
  f.stageTimes = times;

/** Replace all practice orders with a fresh set built around today. Live orders are never touched. */
async function resetDemoData(onProgress) {
  const removed = await deleteDemoOrders();
  const { orders, nextNum } = buildDemoOrders(todayNY());
  let done = 0; const q = [...orders];
  const worker = async () => { while (q.length) { const o = q.shift(); const { id, ...body } = o; await retry(() => Store.db.doc('orders/' + id).set(body)); done++; onProgress && onProgress(done, orders.length); } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  const cref = Store.db.doc('settings/counter');
  await withLease(cref, async () => { const s = await cref.get(); const d = (s.exists && s.data()) || {}; await cref.set({ next: d.next || 1001, demoNext: nextNum }); });
  await retry(() => Store.db.doc('settings/demo').set({ anchor: todayNY(), at: Date.now(), dev: deviceName() }));
  return { removed, created: orders.length };
}

  }
  return null;
}

/** Single taps re-check the store first, so a change made on another device a moment ago is not silently overwritten. */
async function guardedTap(o, it, kind, go) {
  const ref = [{ orderId: o.id, itemId: it.id }];
  const c = await findClashes(ref, kind, seenValues(ref, kind));
  if (c.length) { toast(`Not changed: another device just set ${c[0].label} to ${c[0].now}${c[0].by ? ` (${c[0].by})` : ''}. Check it, then tap again if needed.`, 'bad'); await refreshNow(true); return false; }
  await go(); return true;
}

function PickupPanel({ o, onDone }) {
  const items = itemsOf(o); const open = items.filter(it => !isCollected(it));
  const [sel, setSel] = useState(() => new Set(open.filter(it => (it.stage || 0) === 4).map(it => it.id)));
  const [confirm, setConfirm] = useState(false); const [reason, setReason] = useState('');
  const [busy, run] = useBusy(); const [pid, setPid] = useState(uid());
  const bal = balanceCents(o);
  const chosen = [...sel].filter(id => o.items[id] && !o.items[id].collectedAt);
  const notReady = chosen.filter(id => (o.items[id].stage || 0) < 4);
  const needs = (bal !== null && bal > 0) || notReady.length > 0;
  const pay = m => run(async () => { await addPayment(o, { id: pid, kind: 'payment', amountCents: bal, date: todayNY(), method: m, ref: '' }); setPid(uid()); toast(`${fmtMoney(bal)} ${m} recorded. Balance is now $0.00.`); });
  const doHand = async (paidNow) => {
    const ref = chosen.map(id => ({ orderId: o.id, itemId: id }));
    const c = await findClashes(ref, 'collect', seenValues(ref, 'collect'));
    if (c.length) { toast(`Another device already marked ${c.map(x => x.label).join(', ')} picked up.`, 'bad'); return false; }
    const owe = paidNow ? 0 : (bal > 0 ? bal : 0);
    await collectItems(o, chosen, owe > 0 || notReady.length ? { balance: owe, reason: reason.trim() || 'Handed over with override', notReady: notReady.length > 0, override: true } : null);
    setConfirm(false); setReason(''); return true;
  };
  const handOver = () => run(async () => { if (await doHand(false)) { toast(`${chosen.length} ${chosen.length === 1 ? 'item' : 'items'} picked up.${chosen.length === open.length ? ' Order complete.' : ''}`); onDone && onDone(); } });
  const payAndHand = m => run(async () => {
    await addPayment(o, { id: pid, kind: 'payment', amountCents: bal, date: todayNY(), method: m, ref: '' }); setPid(uid());
    if (await doHand(true)) { toast(`${fmtMoney(bal)} ${m} recorded and ${chosen.length} ${chosen.length === 1 ? 'item' : 'items'} picked up.`); onDone && onDone(); }
  });
  if (!open.length) return html`<div class="callout good pickdone"><b>Everything on this order has been picked up.</b> ${items.map(it => html`<span class="muted small">${itemLabel(o, it)} ${fmtStamp(it.collectedAt)}</span>`)}</div>`;
  return html`<div class="box2 pickup">
    <h3 class="ih">Pickup — hand to customer</h3>
    <div class="pickgrid">${items.map(it => {
      const c = isCollected(it); const rd = (it.stage || 0) === 4;
      return html`<label class=${'pickit' + (c ? ' done' : '') + (rd && !c ? ' rdy' : '')}>
        <input type="checkbox" disabled=${c} checked=${c || sel.has(it.id)} onChange=${e => { const n = new Set(sel); e.target.checked ? n.add(it.id) : n.delete(it.id); setSel(n); setConfirm(false); }} />
        <span class="pi-main"><span class=${'bigstat ' + (c ? 'coll' : rd ? 'rdy' : 'wip')}>${c ? html`<${Icon} n="check" s=${22} />PICKED UP` : rd ? html`<${Icon} n="check" s=${22} />READY` : html`<${Icon} n="clock" s=${22} />IN PROGRESS · ${STAGE_SHORT[it.stage || 0]}`}</span>
          <span><b>${itemLabel(o, it)}</b> ${specBrief(it)}</span>
          <span class="pi-meta">${c ? html`<span class="muted small">Picked up ${fmtTime(nyTimeOf(it.collectedAt))}</span>` : ''}
            ${it.frozen && html`<span class="flag ice"><${Icon} n="snow" s=${14} />Frozen</span>`}
            <span class="where">${it.storage ? html`<b>Stored:</b> ${it.storage}` : 'No storage location recorded'}</span>
            ${hasExtras(it) && html`<span class="flag warn2"><${Icon} n="box" s=${14} />Extras: ${extrasOf(it).filter(x => (x.desc || '').trim()).map(x => x.desc).join(', ')}</span>`}</span></span></label>`;
    })}</div>
    <div class="paybig">
      <div><span class="muted xs">${items.length > 1 ? 'BALANCE — WHOLE ORDER' : 'BALANCE'}</span><b class=${'paytag ' + payState(o).key}>${fmtMoney(bal)}</b><span class="muted small">Total ${fmtMoney(o.totalCents ?? null)} · paid ${fmtMoney(paidCents(o))}</span></div>
      ${bal !== null && bal > 0 && html`<div class="paybtns"><span class="muted small">Took it on the POS? Record it:</span>
        <button class="btn foh" disabled=${busy} onClick=${() => pay('card')}>Paid ${fmtMoney(bal)} · Card</button>
        <button class="btn foh" disabled=${busy} onClick=${() => pay('cash')}>Cash</button>

}

function weekStartTue(d) { const wd = weekday(d); if (wd === 1) return addDays(d, 1); if (wd === 0) return addDays(d, -5); return addDays(d, -(wd - 2)); }
function buildIndex() {
  const idx = {}; const get = d => idx[d] || (idx[d] = { pick: [], prepG: [], orders: 0, items: 0, unfinished: 0, prep: 0, odd: false });
  for (const o of confirmedOrders()) {
    const its = itemsOf(o); const e = get(o.pickupDate);
    e.pick.push({ o, items: its }); e.orders++; e.items += its.length;
    e.unfinished += its.filter(i => !isCollected(i) && (i.stage || 0) < 4).length;
    if (isClosedDay(Store.calendar, o.pickupDate)) e.odd = true;
    const byDay = {};
    for (const it of its) if (it.plan && !isCollected(it) && it.plan.date !== o.pickupDate) { get(it.plan.date).prep++; (byDay[it.plan.date] = byDay[it.plan.date] || []).push(it); }
    for (const [d, list] of Object.entries(byDay)) get(d).prepG.push({ o, items: list });

  for (const e of Object.values(idx)) { e.pick.sort(byTime); e.prepG.sort(byTime); }

}

/* ---------- Pickup (front counter) ---------- */
function counterGroups() {
  const today = todayNY(); const orders = confirmedOrders();
  const waiting = [], notReady = [], done = [];
  for (const o of orders) {
    const its = itemsOf(o); const open = its.filter(it => !isCollected(it));
    if (o.pickupDate === today || (o.pickupDate < today && o.pickupDate >= addDays(today, -14) && open.length)) {
      if (!open.length) { if (its.some(it => it.collectedAt && nyDateOf(it.collectedAt) === today)) done.push(o); }
      else if (open.some(it => (it.stage || 0) === 4)) waiting.push(o);
      else notReady.push(o);
    }
  }
  const t = (a, b) => (a.pickupDate + a.pickupTime).localeCompare(b.pickupDate + b.pickupTime);
  return { waiting: waiting.sort(t), notReady: notReady.sort(t), done: done.sort(t) };
}
function CounterCard({ o, on, pick }) {
  const its = itemsOf(o); const ready = its.filter(it => (it.stage || 0) === 4 && !isCollected(it)); const coll = its.filter(isCollected).length;
  const late = Date.now() > pickupEpoch(o) && its.some(it => !isCollected(it));
  const ps = payState(o); const where = [...new Set(ready.map(it => it.storage).filter(Boolean))].join(', ');
  const open = its.filter(it => !isCollected(it)); const st = !open.length ? 'coll' : open.every(it => (it.stage || 0) === 4) ? 'rdy' : ready.length ? 'part' : 'wip';
  return html`<button class=${'ccard' + (on ? ' on' : '')} onClick=${() => pick(o.id)}>
    <span class=${'ccstat ' + st}>${st === 'coll' ? html`<${Icon} n="check" s=${26} /><b>PICKED UP</b>` : st === 'rdy' ? html`<${Icon} n="check" s=${26} /><b>READY</b>` : st === 'part' ? html`<${Icon} n="clock" s=${26} /><b>PART READY</b>` : html`<${Icon} n="clock" s=${26} /><b>IN PROGRESS</b>`}</span>
    <span class="cc-time">${o.pickupDate !== todayNY() ? html`<small>${fmtDateMed(o.pickupDate)}</small>` : ''}${fmtTime(o.pickupTime)}${late ? html`<small class="badtxt">late</small>` : ''}</span>
    <span class="cc-main"><b>${o.customer?.name}</b> <span class="muted">${orderLabel(o)}${o.demo ? ' · Practice' : ''}</span>
      <span class="cc-sub">${its.length} ${its.length === 1 ? 'item' : 'items'} · ${ready.length} ready${coll ? ` · ${coll} picked up` : ''}${where ? ` · ${where}` : ''}</span></span>
    <span class=${'cc-bal paytag ' + ps.key}>${ps.key === 'paid' ? 'Paid' : ps.key === 'nototal' ? 'No total' : ps.key === 'credit' ? 'Credit' : fmtMoney(balanceCents(o))}</span></button>`;
}

/* ---------- Backup export (spreadsheet / CSV) ---------- */
function csvCell(v) { const s = v === null || v === undefined ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function ordersToCSV(orders) {
  const H = ['Order #', 'Item', 'Booking', 'Pickup date', 'Day', 'Pickup time', 'Customer', 'Phone', 'Email', 'Taken by', 'Product', 'Size', 'Qty', 'Servings', 'Cake flavor', 'Filling', 'Icing', 'Tiers',
    'Inscription', 'Inscription color', 'Colors', 'Decoration / theme', 'Customer requests', 'Paid decoration', 'Extras', 'Stage', 'Frozen', 'Storage', 'Picked up', 'Item price', 'Price note',
    'Order total (shared)', 'Paid (shared)', 'Balance (shared)', 'Production notes', 'Manager notes', 'Practice order'];
  const rows = [H];
  const sorted = [...orders].sort((a, b) => ((a.pickupDate || '') + (a.pickupTime || '')).localeCompare((b.pickupDate || '') + (b.pickupTime || '')) || a.num - b.num);
  for (const o of sorted) for (const it of itemsOf(o)) {
    const notes = mapList(it.notes); const A = it.addons || {};
    rows.push([o.num, `${o.num}-${it.suffix}`, o.booking, o.pickupDate, o.pickupDate ? DAY_NAMES[weekday(o.pickupDate)] : '', fmtTime(o.pickupTime), o.customer?.name, fmtPhone(o.customer?.phone), o.customer?.email, o.takenBy,
      it.type, it.size, it.qty, it.servings, groupsOf(it).length ? groupsOf(it).map(groupBrief).join(' | ') : flavorLong(it), fillingLong(it), it.icing,
      (it.tiers || []).map(t => `${t.size}: Flavor ${flavorLong(t) || '-'} / Filling ${fillingLong(t) || '-'}`).join('; '),
      it.noInscription ? 'NO INSCRIPTION' : it.inscription, it.inscriptionColor, it.colors, it.decoration,
      [it.requests, ...notes.filter(n => n.kind === 'cust').map(n => n.text)].filter(Boolean).join(' | '),
      [A.animated && 'Animated picture', A.portrait && 'Portrait', A.shaped && `Shaped${it.shapeDesc ? ': ' + it.shapeDesc : ''}`, A.themeOn && 'Theme', A.figuresOn && 'Figures', it.picturePhone && `Picture contact ${fmtPhone(it.picturePhone)}`, ...(A.custom || []).map(c => c.label)].filter(Boolean).join(', '),
      extrasOf(it).filter(x => (x.desc || '').trim()).map(x => `${x.desc}${x.cents ? ` (${fmtMoney(x.cents)})` : ''}`).join('; '), STAGES[it.stage || 0], it.frozen ? 'Yes' : '', it.storage, it.collectedAt ? fmtStamp(it.collectedAt) : '',
      it.priceCents === null || it.priceCents === undefined ? '' : (it.priceCents / 100).toFixed(2), it.price ? (it.price.override ? `Override: ${it.price.override.reason}` : it.price.complete ? '' : 'Not final') : '',
      o.totalCents === null || o.totalCents === undefined ? '' : (o.totalCents / 100).toFixed(2), (paidCents(o) / 100).toFixed(2), balanceCents(o) === null ? '' : (balanceCents(o) / 100).toFixed(2),
      notes.filter(n => n.kind === 'prod').map(n => n.text).join(' | '), notes.filter(n => n.kind === 'mgr').map(n => n.text).join(' | '), o.demo ? 'Yes' : '']);
  }
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}
async function saveBackup(orders, tag) {
  if (!Store.downloads) { toast('Saving files isn’t available in this view. Try the Claude app or a desktop browser.', 'bad'); return false; }
  try {

  } catch (e) { if (e && e.code !== 'declined') toast(errText(e), 'bad'); return false; }
}

function ListEd({ list, catKey, cats, title, flag, ch }) {
  return html`<div class="box2 pe"><h3 class="ih">${title}</h3><ul class="pelist">${list.map((x, i) => html`<li key=${x.id} class=${x.retired ? 'retired' : ''}>
      <span class="pein"><input aria-label="Name" defaultValue=${x.label} onChange=${e => { x.label = e.target.value.trim() || x.label; ch(); }} /></span>
      ${cats && html`<select aria-label="Price category" value=${x[catKey]} onChange=${e => { x[catKey] = e.target.value; ch(); }}>${cats.map(([k, l]) => html`<option value=${k}>${l}</option>`)}</select>`}
      ${flag && html`<label class="check sm"><input type="checkbox" checked=${!!x[flag[0]]} onChange=${e => { x[flag[0]] = e.target.checked; ch(); }} />${flag[1]}</label>`}
      <button class="btn sm ghost" onClick=${() => { x.retired = !x.retired; ch(); }}>${x.retired ? 'Restore' : 'Retire'}</button></li>`)}</ul>
    <button class="btn sm" onClick=${() => { list.push({ id: uid(6), label: 'New option', ...(cats ? { [catKey]: cats[0][0] } : {}) }); ch(); }}><${Icon} n="plus" s=${16} />Add</button></div>`;
}
function MenuEditor() {
  const [m, setM] = useState(null); const [ver, setVer] = useState(0); const [busy, run] = useBusy();
  const cur = m || JSON.parse(JSON.stringify(menu()));
  const ch = () => setM({ ...cur });
  return html`<section class="sec" key=${ver}><h2>Menu & prices <span class="secn">effective ${cur.effective || 'March 2026'}${Store.menuRev ? ` · revision ${Store.menuRev}` : ' · from the owner’s price sheet'}</span></h2>
    <p class="callout info">The order form uses these prices to give staff a starting price; staff can override any price with a reason. Changing a price here never changes an order that was already agreed — if a saved order would come out different, the form asks which price to keep.</p>
    <div class="box2"><h3 class="ih">Standard cakes (three layers, two fillings)</h3><div class="tscroll"><table class="ptable"><thead><tr><th>Size</th><th>Serves</th><th>Regular filling</th><th>Extra filling</th><th>Red velvet / carrot (any filling)</th><th>Premium filling</th><th>Cannoli filling</th><th>Tiramisu / tres leches</th></tr></thead>
      <tbody>${cur.standard.map(r => html`<tr><td>${r.label}</td><td>${r.serv}</td>${r.p.map((c, k) => html`<td><${PriceIn} ch=${ch} label=${`${r.label} ${PRICE_COLS[k]}`} get=${() => r.p[k]} set=${v => { r.p[k] = v; }} /></td>`)}</tr>`)}</tbody></table></div>
      <p class="muted small">Carrot is not available in 8-inch or 12-inch (set on the Carrot flavor).</p></div>
    <div class="twocol">
      <div class="box2"><h3 class="ih">Tier-style cakes (starting prices, all fillings included)</h3><table class="ptable"><tbody>${cur.tier.map(r => html`<tr><td>${r.label}${r.delivery ? ' (plus delivery)' : ''}</td><td>${r.serv}</td><td><${PriceIn} ch=${ch} label=${r.label} get=${() => r.p} set=${v => { r.p = v; }} /></td></tr>`)}</tbody></table></div>
      <div class="box2"><h3 class="ih">Other prices</h3><table class="ptable"><tbody>
        ${cur.single.map(r => html`<tr><td>${r.label}</td><td><${PriceIn} ch=${ch} label=${r.label} get=${() => r.p} set=${v => { r.p = v; }} /></td></tr>`)}
        <tr><td>Cupcake cake, classic — per dozen</td><td><${PriceIn} ch=${ch} label="classic dozen" get=${() => cur.cupcake.classic} set=${v => { cur.cupcake.classic = v; }} /></td></tr>
        <tr><td>Cupcake cake, red velvet / carrot — per dozen</td><td><${PriceIn} ch=${ch} label="premium dozen" get=${() => cur.cupcake.premcake} set=${v => { cur.cupcake.premcake = v; }} /></td></tr>
        <tr><td>Shaped cupcake arrangement</td><td><${PriceIn} ch=${ch} label="shaped" get=${() => cur.cupcake.shaped} set=${v => { cur.cupcake.shaped = v; }} /></td></tr>
        ${[['ganache', 'Ganache icing (once per cake)'], ['animated', 'Animated picture'], ['portrait', 'Personal portrait'], ['themeStart', 'Theme decoration — starting price'], ['figureStart', 'Figures — starting price'], ['tierTresLeches', 'Tres leches in a tier-style cake (once)']].map(([k, l]) => html`<tr><td>${l}</td><td><${PriceIn} ch=${ch} label=${l} get=${() => cur.addons[k]} set=${v => { cur.addons[k] = v; }} /></td></tr>`)}
      </tbody></table></div>
    </div>
    <div class="pegrid">
      <${ListEd} ch=${ch} list=${cur.flavors} title="Cake flavors" catKey="kind" cats=${FLAVOR_KINDS} />
      <${ListEd} ch=${ch} list=${cur.fillings} title="Fillings" catKey="cat" cats=${FILLING_CATS} />
      <${ListEd} ch=${ch} list=${cur.icings} title="Icings" flag=${['ganache', 'charged as ganache']} />
    </div>
    ${!Store.canEdit && html`<p class="callout warn">Only the owner and people with edit access can change menu prices. You can see them here.</p>`}
    ${m && Store.canEdit && html`<div class="savebar"><b>Unsaved menu changes.</b><button class="btn primary" disabled=${busy} onClick=${() => run(async () => { try { await saveMenu(cur); setM(null); setVer(ver + 1); toast('Menu & prices saved. New prices apply to new quotes.'); } catch (e) { if (e.code === 'conflict') { setM(null); setVer(ver + 1); } throw e; } })}>${busy ? 'Saving…' : 'Save menu & prices'}</button><button class="btn ghost" onClick=${() => { setM(null); setVer(ver + 1); }}>Discard changes</button></div>`}
    <details class="box2"><summary><b>Rules still to confirm with the owner</b> (${OPEN_QUESTIONS.length})</summary><ul>${OPEN_QUESTIONS.map(q => html`<li>${q}</li>`)}</ul>
      <p class="muted small">Until confirmed, the order form flags these cases for a manual price instead of guessing.</p></details>
  </section>`;
}


try {
  render(html`<${App} />`, document.getElementById('root'));
  initStore().catch(e => { console.error(e); Store.status = 'nodb'; emit(); });
} catch (e) { console.error(e); document.getElementById('root').textContent = 'This page could not start: ' + e.message; }
</script>
</body></html>
